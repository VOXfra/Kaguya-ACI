name: VOX CardSim V0.3 Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate web assets
        run: |
          node --check cardsim-v03/app/src/main/assets/v03a.js
          node --check cardsim-v03/app/src/main/assets/v03b.js
          node --check cardsim-v03/app/src/main/assets/v03c.js
          grep -q 'v03.css' cardsim-v03/app/src/main/assets/index.html
          grep -q 'versionCode = 3' cardsim-v03/app/build.gradle.kts
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: cardsim-v03
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v0.3-APK
          path: cardsim-v03/app/build/outputs/apk/debug/app-debug.apk
