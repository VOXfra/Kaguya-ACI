name: Build Chronomark APK

on:
  push:
    branches: [ chronomark-apk-build ]
    paths-ignore:
      - 'chronomark/releases/**'
      - 'chronomark/last-build-run.txt'
      - 'chronomark/last-build-status.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronomark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply v0.8 watch-command hook
        run: python3 tools/patch_v08_hook.py

      - name: Apply v0.9 focused Music/Phone polish
        run: python3 tools/patch_v09_focus.py

      - name: Apply v1.0.1 Weather compile fix
        run: python3 tools/patch_v101_compile.py

      - name: Apply v1.0.2 reliability patch
        run: python3 tools/patch_v102_reliability.py

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace > build-v102.log 2>&1
          code=$?
          tail -n 200 build-v102.log > last-build-status.txt
          printf '\nEXIT_CODE=%s\nRUN_ID=%s\n' "$code" "$GITHUB_RUN_ID" >> last-build-status.txt
          exit "$code"

      - name: Record failed build diagnostic
        if: steps.build.outcome != 'success'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronomark/last-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Chronomark+ v1.0.2 build failure"
            git push
          fi

      - name: Stop on build failure
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ChronomarkPlus-v1.0.2-debug
          path: chronomark/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish branch APK
        if: steps.build.outcome == 'success'
        working-directory: .
        run: |
          mkdir -p chronomark/releases
          cp chronomark/app/build/outputs/apk/debug/app-debug.apk chronomark/releases/ChronomarkPlus-v1.0.2-debug.apk
          printf '%s\n' "$GITHUB_RUN_ID" > chronomark/last-build-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronomark/releases/ChronomarkPlus-v1.0.2-debug.apk chronomark/last-build-run.txt
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Chronomark+ v1.0.2 APK"
            git push
          fi
