name: Build Chronomark APK

on:
  push:
    branches: [ chronomark-apk-build ]
    paths-ignore:
      - 'chronomark/releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronomark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronomarkPlus-v0.6.0-debug
          path: chronomark/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish branch APK
        working-directory: .
        run: |
          mkdir -p chronomark/releases
          cp chronomark/app/build/outputs/apk/debug/app-debug.apk chronomark/releases/ChronomarkPlus-v0.6.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronomark/releases/ChronomarkPlus-v0.6.0-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish Chronomark+ v0.6.0 APK"
            git push
          fi
