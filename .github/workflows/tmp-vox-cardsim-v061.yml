name: VOX CardSim V0.6.1 Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle Eevee data and product art
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="cardsim-v03/app/src/main/assets"
          mkdir -p "$ASSETS/img"
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/seavey-org/tcg-tracker/11ca9a20d57e88d5091e92ff0c907458e7e36281/backend/data/pokemon-tcg-data-japan/cards/jp-s6a-eevee-heroes.json' \
            -o "$ASSETS/eevee_heroes.json"
          curl -L --fail --retry 3 'https://archives.bulbagarden.net/media/upload/thumb/1/1f/S6a_Eevee_Heroes_Logo.png/1200px-S6a_Eevee_Heroes_Logo.png' -o "$ASSETS/img/eevee_logo.png"
          curl -L --fail --retry 3 'https://tcgplayer-cdn.tcgplayer.com/product/565350_400w.jpg' -o "$ASSETS/img/eevee_booster.jpg"
          curl -L --fail --retry 3 'https://tcgplayer-cdn.tcgplayer.com/product/565351_400w.jpg' -o "$ASSETS/img/eevee_box.jpg"
          curl -L --fail --retry 3 'https://d2j6dbq0eux0bg.cloudfront.net/images/51000416/4098527801.jpg' -o "$ASSETS/img/binder_151.jpg"
          curl -L --fail --retry 3 'https://matraws.dk/cdn/shop/files/ultra-pro-charizard-pokemon-obsidian-flames-9-pocket-portfolio-mappe-kortspil-643.webp?crop=center&height=1200&v=1707377473&width=1200' -o "$ASSETS/img/binder_obsidian.webp"
          curl -L --fail --retry 3 'https://kawaiicollector.com.au/cdn/shop/files/Paldea-Evolved-Portfolio-Large_1200x1200.png?v=1693561546' -o "$ASSETS/img/binder_paldea.png"
          curl -L --fail --retry 3 'https://s3-ap-northeast-1.amazonaws.com/jiraffe-magi/prod/images/item/9644364/1.jpg' -o "$ASSETS/img/binder_eevee.jpg"

      - name: Validate Eevee dataset
        run: |
          python - <<'PY'
          import json
          p='cardsim-v03/app/src/main/assets/eevee_heroes.json'
          data=json.load(open(p,encoding='utf-8'))
          nums={int(str(x['number']).split('/')[0]) for x in data if x.get('number') and x['number']!='N/A'}
          assert nums==set(range(1,102)), (len(nums), min(nums), max(nums))
          rar={x.get('rarity') for x in data if x.get('number')!='N/A'}
          for r in ['Common','Uncommon','Rare','Double Rare','Triple Rare','Super Rare','Hyper Rare','Ultra Rare']:
              assert r in rar, r
          print('Eevee Heroes dataset OK:',len(nums),'cards')
          PY

      - name: Validate web assets
        run: |
          node --check cardsim-v03/app/src/main/assets/v03a.js
          node --check cardsim-v03/app/src/main/assets/v03b.js
          node --check cardsim-v03/app/src/main/assets/v04pre.js
          node --check cardsim-v03/app/src/main/assets/v05pre.js
          node --check cardsim-v03/app/src/main/assets/v06pre.js
          node --check cardsim-v03/app/src/main/assets/v061pre.js
          node --check cardsim-v03/app/src/main/assets/v03c.js
          node --check cardsim-v03/app/src/main/assets/v04market1.js
          node --check cardsim-v03/app/src/main/assets/v04market2.js
          node --check cardsim-v03/app/src/main/assets/v04market3.js
          node --check cardsim-v03/app/src/main/assets/v05features.js
          node --check cardsim-v03/app/src/main/assets/v05fix.js
          node --check cardsim-v03/app/src/main/assets/v06features.js
          node --check cardsim-v03/app/src/main/assets/v06fix.js
          node --check cardsim-v03/app/src/main/assets/v061fix.js
          grep -q 'v061pre.js' cardsim-v03/app/src/main/assets/index.html
          grep -q 'v061fix.js' cardsim-v03/app/src/main/assets/index.html
          grep -q 'versionCode = 7' cardsim-v03/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: cardsim-v03
        run: gradle :app:assembleRelease --no-daemon

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          path: ${{ runner.temp }}/signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32137945543

      - name: Sign APK with permanent key
        shell: bash
        run: |
          STOREPASS="$(sed -n 's/^Store password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          KEYPASS="$(sed -n 's/^Key password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/vox-cardsim-release.jks" \
            --ks-key-alias vox-cardsim \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/VOX_CardSim_v0.6.1.apk" \
            cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/VOX_CardSim_v0.6.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v0.6.1-APK
          path: ${{ runner.temp }}/VOX_CardSim_v0.6.1.apk
