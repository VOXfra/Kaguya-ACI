name: PS5Native v14.2 Integrated Runtime Stress Windows CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime-stress-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v14.0.2 CI base
        shell: pwsh
        run: |
          $parts = Get-ChildItem -LiteralPath "ci/ps5native-v14.0.2/chunks" -File -Filter "part-*" | Sort-Object Name
          if ($parts.Count -ne 13) { throw "Expected 13 base chunks, got $($parts.Count)" }
          $b64 = [System.Text.StringBuilder]::new()
          foreach ($p in $parts) { [void]$b64.Append((Get-Content -LiteralPath $p.FullName -Raw).Trim()) }
          $bytes = [Convert]::FromBase64String($b64.ToString())
          $zip = Join-Path $env:RUNNER_TEMP "v1402-minici.zip"
          [IO.File]::WriteAllBytes($zip, $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sha -ne "7271f11aba8ebd8f7e1e78bb70ad8e49d966352e685422b2fd090664a4877789") {
            throw "Base archive SHA256 mismatch: $sha"
          }
          $extract = Join-Path $env:RUNNER_TEMP "v142-ci"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $src = Join-Path $extract "v1402-minici"
          "V142_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply verified v14.1 runtime patch
        shell: pwsh
        run: |
          $gz = Resolve-Path "ci/ps5native-v14.1/v141.patch.gz"
          $gzSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $gz).Hash.ToLowerInvariant()
          if ($gzSha -ne "a207d3f2f8a0aed996e4bd70ec19aa58617e743a0e99217acf5bf7ca4c884d27") {
            throw "v14.1 patch gzip SHA256 mismatch: $gzSha"
          }
          $patch = Join-Path $env:RUNNER_TEMP "v141.patch"
          python -c "import gzip,pathlib; pathlib.Path(r'$patch').write_bytes(gzip.decompress(pathlib.Path(r'$gz').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
          if ($patchSha -ne "770be21c35774e06628cb288e9513fcfb34c40f4b18611aa8867bd11a90f60a9") {
            throw "v14.1 patch SHA256 mismatch: $patchSha"
          }
          Push-Location "$env:V142_SRC"
          git init
          git config user.email "ci@example.invalid"
          git config user.name "PS5Native CI"
          git add .
          git commit -m "v14.0.2 mini base"
          git apply --check "$patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply "$patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add .
          git commit -m "v14.1 threaded runtime"
          Pop-Location

      - name: Apply verified v14.2 integrated stress patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem -LiteralPath "ci/ps5native-v14.2/chunks" -File -Filter "part-*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 v14.2 patch chunks, got $($parts.Count)" }
          $b64 = [System.Text.StringBuilder]::new()
          foreach ($p in $parts) { [void]$b64.Append((Get-Content -LiteralPath $p.FullName -Raw).Trim()) }
          $gz = Join-Path $env:RUNNER_TEMP "v142.patch.gz"
          [IO.File]::WriteAllBytes($gz, [Convert]::FromBase64String($b64.ToString()))
          $gzSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $gz).Hash.ToLowerInvariant()
          if ($gzSha -ne "26232b7436873bd4f8a9f5adedd76184e94ac6dc27d266b6cebe790260e804d2") {
            throw "v14.2 patch gzip SHA256 mismatch: $gzSha"
          }
          $patch = Join-Path $env:RUNNER_TEMP "v142.patch"
          python -c "import gzip,pathlib; pathlib.Path(r'$patch').write_bytes(gzip.decompress(pathlib.Path(r'$gz').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
          if ($patchSha -ne "e0d8f4bc63b71153070aaaaf020b570ea2cdefa4f17a9cb85c0f9455d1fd6864") {
            throw "v14.2 patch SHA256 mismatch: $patchSha"
          }
          Push-Location "$env:V142_SRC"
          git apply --check "$patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply "$patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Configure and build exact v14.2 changed runtime with MSVC
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "v142-build"
          cmake -S "$env:V142_SRC" -B "$build" -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$build" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "V142_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate runtime stress fixtures
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP "v142-fixtures"
          python "$env:V142_SRC\tools\make-runtime-stress-fixtures-v14.2.py" "$fixtures"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "V142_FIXTURES=$fixtures" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run v14.1 threaded regression on v14.2 core
        shell: pwsh
        run: |
          $exe = Join-Path $env:V142_BUILD "Release\ThreadedDependencyProbe.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing ThreadedDependencyProbe.exe: $exe" }
          $out = & $exe "$env:V142_FIXTURES" 2>&1
          $rc = $LASTEXITCODE
          $out | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "threaded-regression-v14.2.log")
          $joined = $out -join "`n"
          if ($rc -ne 0) { throw "ThreadedDependencyProbe regression failed with exit code $rc" }
          if ($joined -notmatch "V141_THREADED_DEPENDENCY_RUNTIME_OK") { throw "Missing v14.1 threaded regression marker" }

      - name: Run full v14.2 integrated runtime stress matrix
        shell: pwsh
        run: |
          $exe = Join-Path $env:V142_BUILD "Release\RuntimeStressProbe.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing RuntimeStressProbe.exe: $exe" }
          $log = Join-Path $env:RUNNER_TEMP "runtime-stress-v14.2.log"
          $out = & $exe "$env:V142_FIXTURES" 2>&1
          $rc = $LASTEXITCODE
          $out | Tee-Object -FilePath $log
          $joined = $out -join "`n"
          if ($rc -ne 0) { throw "RuntimeStressProbe failed with exit code $rc" }
          $required = @(
            "Async multi-module ThreadService 8-worker join matrix: PASS",
            "Async multi-module ThreadService fault propagation/recovery: PASS",
            "Runtime stress coordinator barrier/wake: PASS",
            "Runtime stress 64 batches / 256 guest calls: PASS batches=64 calls=256",
            "Runtime stress mutex/key/condition/semaphore/address-wait/memory: PASS",
            "Runtime stress 8 injected guest faults isolated: PASS faults=8",
            "Runtime stress main TLS intact: PASS",
            "Runtime stress root after load: PASS return=156",
            "Runtime stress service cleanup/stale handles: PASS",
            "Runtime stress shutdown/unload: PASS",
            "V142_INTEGRATED_RUNTIME_STRESS_OK"
          )
          foreach ($marker in $required) {
            if ($joined -notmatch [regex]::Escape($marker)) { throw "Missing v14.2 marker: $marker" }
          }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS5Native-v14.2-integrated-runtime-stress-windows-logs
          path: |
            ${{ runner.temp }}/threaded-regression-v14.2.log
            ${{ runner.temp }}/runtime-stress-v14.2.log
          if-no-files-found: warn
