name: VOX CardSim V1.1.6 Audited Collation

on:
  pull_request:
    branches: [main]
    paths:
      - 'cardsim-v03/**'
      - '.github/workflows/tmp-vox-cardsim-v114-release.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate V1.1.6 data
        shell: bash
        run: |
          set -euo pipefail
          A=cardsim-v03/app/src/main/assets
          mkdir -p "$A/img" "$A/img/v109" "$A/img/v109/me05_cards"
          rm -rf "$A/catalog/fr" "$A/img/v115/products"

          # Données cartes FR + détails de rareté, scans locaux spéciaux et produits physiques.
          python cardsim-v03/tools/generate_v110_data.py
          python cardsim-v03/tools/generate_v105_catalog.py
          python cardsim-v03/tools/import_physical_collections_release.py --lang fr
          python cardsim-v03/tools/fetch_release_assets.py
          python cardsim-v03/tools/import_verified_sealed_products.py

          # V1.1.6 : profils de collation construits APRÈS les catalogues cartes/produits.
          python cardsim-v03/tools/generate_v116_collation_profiles.py

          # Contrats de structure puis simulation réelle du moteur JS sur des dizaines
          # de milliers de boosters : aucun retour au vieux generatePack générique.
          python cardsim-v03/tools/test_v116_collation_profiles.py
          node cardsim-v03/tools/test_v116_collation_runtime.js

          for f in "$A"/*.js; do node --check "$f"; done
          python -m py_compile \
            cardsim-v03/tools/import_all_collections.py \
            cardsim-v03/tools/import_all_collections_release.py \
            cardsim-v03/tools/import_physical_collections_release.py \
            cardsim-v03/tools/import_verified_sealed_products.py \
            cardsim-v03/tools/fetch_release_assets.py \
            cardsim-v03/tools/generate_v116_collation_profiles.py \
            cardsim-v03/tools/test_v116_collation_profiles.py

          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('cardsim-v03/app/src/main/assets')

          idx=json.loads((a/'v111_collection_index.json').read_text(encoding='utf-8'))
          sets=idx['sets']; s=idx['stats']
          assert idx['schema']==111 and idx['language']=='fr', idx
          assert s['failed']==0 and s['imported']==s['discovered']==len(sets), s
          assert len(sets)>=180, len(sets)
          assert all(x.get('seriesId')!='tcgp' for x in sets)
          ids={x['id'] for x in sets}
          for required in ['base1','neo1','sm8','sv03.5','me02.5','me03','me04','me05']:
              assert required in ids, required
          assert 'A1' not in ids and 'P-A' not in ids
          for x in sets:
              p=a/'catalog'/'fr'/x['file']
              assert p.is_file() and p.stat().st_size>40,(x['id'],p)
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d.get('set',{}).get('id')==x['id'],x['id']
              assert d.get('set',{}).get('seriesId')!='tcgp',x['id']
              assert len(d.get('cards') or [])==int(x.get('cards') or 0)==int(x.get('total') or 0),x['id']
          assert len(list((a/'catalog'/'fr').glob('*.json')))==len(sets)

          sealed=json.loads((a/'v115_sealed_catalog.json').read_text(encoding='utf-8'))
          ss=sealed['stats']; products=[p for rows in sealed['sets'].values() for p in rows]
          assert sealed['schema']==115 and sealed['language']=='fr'
          assert ss['setsWithVerifiedProducts']>=100, ss
          assert ss['products']>=250 and ss['localImages']>=180, ss
          assert ss['tcgcsvMatchedSets']>=90, ss
          assert 'sm8' in sealed['sets'] and any(p.get('mode')=='loose' for p in sealed['sets']['sm8'])
          assert not any('pack créatif' in str(p.get('name','')).casefold() for p in products)
          assert not any(str(p.get('id','')).startswith('v114-creative-pack-') for p in products)
          for p in products:
              if p.get('image'): assert (a/p['image']).is_file(),p

          col=json.loads((a/'v116_collation_profiles.json').read_text(encoding='utf-8'))
          assert col['schema']==116 and col['language']=='fr', col
          assert len(col.get('sets') or {})>=90, col.get('stats')
          for sid in ['base1','ecard1','ex1','dp1','hgss1','bw1','xy1','sm1','swsh1','sv01','me01','me05','det1','cel25']:
              assert sid in col['sets'], sid
          # Les sous-collections ne deviennent jamais des boosters autonomes.
          for sid in ['cel25cc','sma','swsh4.5sv','swsh9.5tg','swsh12.5gg']:
              assert sid not in col['sets'], sid

          text=(a/'pitch_black_embed.js').read_text(encoding='utf-8')
          m=re.search(r'window\.V090_PITCH_BLACK_DATA=(.*);\s*$',text,re.S); assert m
          cards=json.loads(m.group(1))['cards']; assert len(cards)==120
          assert [int(c['localId']) for c in cards if c.get('v109BundledFrenchScan')]==list(range(75,90))
          print('Physical catalog:',s,'sets=',len(sets))
          print('Verified products:',ss)
          print('Collation:',col.get('stats'), 'profiles=',len(col['sets']))
          PY

          test -s "$A/img/missing-card.svg"
          grep -q 'versionCode = 42' cardsim-v03/app/build.gradle.kts
          grep -q 'versionName = "1.1.6"' cardsim-v03/app/build.gradle.kts
          grep -q "V115_VERSION='1.1.5'" "$A/v115fix.js"
          grep -q "V116_VERSION='1.1.6'" "$A/v116fix.js"
          grep -q 'v116_collation_profiles.js' "$A/v111boot.js"
          grep -q 'v116fix.js' "$A/v111boot.js"
          grep -q 'v115_sealed_catalog.js' "$A/index.html"
          grep -q 'v114early.js' "$A/index.html"
          grep -q 'position:absolute!important' "$A/v114fix.js"
          grep -q 'position:absolute!important' "$A/v114early.js"
          grep -q 'Aucun produit physique vérifié' "$A/v115fix.js"
          grep -q 'DIGITAL_SERIES_IDS = {"tcgp"}' cardsim-v03/tools/import_physical_collections_release.py
          grep -q 'readCatalogFile' cardsim-v03/app/src/main/java/com/vox/cardsim/OfflineQueueBridge.java
          grep -q 'WorkManager' cardsim-v03/app/src/main/java/com/vox/cardsim/OfflineQueueBridge.java

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$S"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$S" --licenses >/dev/null || true
            "$S" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Clean release build without Gradle cache
        working-directory: cardsim-v03
        run: |
          rm -rf app/build .gradle
          gradle clean :app:assembleRelease --no-daemon --no-build-cache --rerun-tasks

      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK=cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          for f in v108boot.js v108fix.js v109boot.js v109fix.js v109hotfix.js \
            v111boot.js v111fix.js v111catalogfix.js v111condition.js v111conditionfix.js v111perf.js \
            v112fix.js v113fix.js v114early.js v114fix.js v115fix.js v115_sealed_catalog.js \
            v115_sealed_catalog.json v116fix.js v116_collation_profiles.js v116_collation_profiles.json \
            v111_collection_index.js v111_collection_index.json; do
            unzip -l "$APK" | grep -q "assets/$f"
          done
          unzip -p "$APK" assets/v116fix.js | grep -q "V116_VERSION='1.1.6'"
          unzip -p "$APK" assets/v111boot.js | grep -q 'v116_collation_profiles.js'
          unzip -p "$APK" assets/v111boot.js | grep -q 'v116fix.js'
          unzip -p "$APK" assets/v114fix.js | grep -q 'position:absolute!important'
          EXPECTED=$(unzip -p "$APK" assets/v111_collection_index.json | python -c 'import json,sys; print(len(json.load(sys.stdin)["sets"]))')
          COUNT=$(unzip -l "$APK" | grep -c 'assets/catalog/fr/.*\.json')
          test "$COUNT" -eq "$EXPECTED"
          ! unzip -l "$APK" | grep -q 'assets/catalog/fr/A1.json'
          test "$(unzip -l "$APK" | grep -c 'assets/img/v109/me05_cards/')" -eq 15
          test "$(unzip -l "$APK" | grep -c 'assets/img/v115/products/')" -ge 180

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          path: ${{ runner.temp }}/signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32137945543

      - name: Sign and verify
        shell: bash
        run: |
          set -euo pipefail
          SP="$(sed -n 's/^Store password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          KP="$(sed -n 's/^Key password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          OUT="$RUNNER_TEMP/VOX_CardSim_v1.1.6.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/vox-cardsim-release.jks" \
            --ks-key-alias vox-cardsim \
            --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v1.1.6-audited-collation
          path: ${{ runner.temp }}/VOX_CardSim_v1.1.6.apk
          if-no-files-found: error
