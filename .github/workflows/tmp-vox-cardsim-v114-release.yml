name: VOX CardSim V1.1.4 Physical Catalog Stable Boosters

on:
  pull_request:
    branches: [main]
    paths:
      - 'cardsim-v03/**'
      - '.github/workflows/tmp-vox-cardsim-v114-release.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate V1.1.4 data
        shell: bash
        run: |
          set -euo pipefail
          A=cardsim-v03/app/src/main/assets
          mkdir -p "$A/img" "$A/img/v109" "$A/img/v109/me05_cards"
          rm -rf "$A/catalog/fr"

          python cardsim-v03/tools/generate_v110_data.py
          python cardsim-v03/tools/generate_v105_catalog.py
          python cardsim-v03/tools/import_physical_collections_release.py --lang fr
          python cardsim-v03/tools/fetch_release_assets.py

          for f in "$A"/*.js; do node --check "$f"; done
          python -m py_compile \
            cardsim-v03/tools/import_all_collections.py \
            cardsim-v03/tools/import_all_collections_release.py \
            cardsim-v03/tools/import_physical_collections_release.py \
            cardsim-v03/tools/fetch_release_assets.py

          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('cardsim-v03/app/src/main/assets')
          idx=json.loads((a/'v111_collection_index.json').read_text(encoding='utf-8'))
          sets=idx['sets']; s=idx['stats']
          assert idx['schema']==111 and idx['language']=='fr', idx
          assert s['failed']==0 and s['imported']==s['discovered']==len(sets), s
          assert len(sets)>=180, len(sets)
          assert all(x.get('seriesId')!='tcgp' for x in sets), 'Pokémon TCG Pocket leaked into physical catalog'
          ids={x['id'] for x in sets}
          for required in ['base1','neo1','sv03.5','me02.5','me03','me04','me05']:
              assert required in ids, required
          assert 'A1' not in ids and 'P-A' not in ids, 'digital Pocket IDs leaked'
          for x in sets:
              p=a/'catalog'/'fr'/x['file']
              assert p.is_file() and p.stat().st_size>40,(x['id'],p)
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d.get('set',{}).get('id')==x['id'],x['id']
              assert d.get('set',{}).get('seriesId')!='tcgp',x['id']
              assert len(d.get('cards') or [])==int(x.get('cards') or 0)==int(x.get('total') or 0),x['id']
          files=list((a/'catalog'/'fr').glob('*.json'))
          assert len(files)==len(sets),(len(files),len(sets))

          text=(a/'pitch_black_embed.js').read_text(encoding='utf-8')
          m=re.search(r'window\.V090_PITCH_BLACK_DATA=(.*);\s*$',text,re.S); assert m
          cards=json.loads(m.group(1))['cards']; assert len(cards)==120
          assert [int(c['localId']) for c in cards if c.get('v109BundledFrenchScan')]==list(range(75,90))
          print('Physical catalog:',s,'sets=',len(sets))
          PY

          test -s "$A/img/missing-card.svg"
          grep -q 'versionCode = 40' cardsim-v03/app/build.gradle.kts
          grep -q 'versionName = "1.1.4"' cardsim-v03/app/build.gradle.kts
          grep -q "V114_VERSION='1.1.4'" "$A/v114fix.js"
          grep -q 'v114fix.js' "$A/v111boot.js"
          grep -q 'v114early.js' "$A/index.html"
          grep -q 'position:absolute!important' "$A/v114fix.js"
          grep -q 'position:absolute!important' "$A/v114early.js"
          grep -q 'Pack créatif' "$A/v114fix.js"
          grep -q 'DIGITAL_SERIES_IDS = {"tcgp"}' cardsim-v03/tools/import_physical_collections_release.py
          grep -q 'readCatalogFile' cardsim-v03/app/src/main/java/com/vox/cardsim/OfflineQueueBridge.java
          grep -q 'WorkManager' cardsim-v03/app/src/main/java/com/vox/cardsim/OfflineQueueBridge.java

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$S"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$S" --licenses >/dev/null || true
            "$S" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Clean release build without Gradle cache
        working-directory: cardsim-v03
        run: |
          rm -rf app/build .gradle
          gradle clean :app:assembleRelease --no-daemon --no-build-cache --rerun-tasks

      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK=cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          for f in v108boot.js v108fix.js v109boot.js v109fix.js v109hotfix.js \
            v111boot.js v111fix.js v111catalogfix.js v111condition.js v111conditionfix.js v111perf.js \
            v112fix.js v113fix.js v114early.js v114fix.js v111_collection_index.js v111_collection_index.json; do
            unzip -l "$APK" | grep -q "assets/$f"
          done
          unzip -p "$APK" assets/v114fix.js | grep -q "V114_VERSION='1.1.4'"
          unzip -p "$APK" assets/v114fix.js | grep -q 'position:absolute!important'
          unzip -p "$APK" assets/index.html | grep -q 'v114early.js'
          EXPECTED=$(unzip -p "$APK" assets/v111_collection_index.json | python -c 'import json,sys; print(len(json.load(sys.stdin)["sets"]))')
          COUNT=$(unzip -l "$APK" | grep -c 'assets/catalog/fr/.*\.json')
          test "$COUNT" -eq "$EXPECTED"
          ! unzip -l "$APK" | grep -q 'assets/catalog/fr/A1.json'
          test "$(unzip -l "$APK" | grep -c 'assets/img/v109/me05_cards/')" -eq 15

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          path: ${{ runner.temp }}/signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32137945543

      - name: Sign and verify
        shell: bash
        run: |
          set -euo pipefail
          SP="$(sed -n 's/^Store password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          KP="$(sed -n 's/^Key password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          OUT="$RUNNER_TEMP/VOX_CardSim_v1.1.4.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/vox-cardsim-release.jks" \
            --ks-key-alias vox-cardsim \
            --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v1.1.4-physical-stable
          path: ${{ runner.temp }}/VOX_CardSim_v1.1.4.apk
          if-no-files-found: error
