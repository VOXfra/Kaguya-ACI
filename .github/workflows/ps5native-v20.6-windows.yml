name: PS5Native v20.6 Orbis TLS Windows CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  orbis-tls:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run v20.6 TLS contract
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc ci\ps5native-v20.6\contract.cpp /Fe:%RUNNER_TEMP%\V206TlsContract.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\V206TlsContract.exe"
          if errorlevel 1 exit /b 1
      - name: Policy markers
        shell: powershell
        run: |
          Write-Host 'V206_TCB_DTV_MODEL=1'
          Write-Host 'V206_DTPMOD64=1'
          Write-Host 'V206_DTPOFF64=0'
          Write-Host 'V206_TPOFF64=0'
          Write-Host 'V206_TLSDESC=0'
          Write-Host 'V206_BASELINE_PERCENT=86.0'
          Write-Host 'V206_SYNTHETIC_CREDIT=0'
