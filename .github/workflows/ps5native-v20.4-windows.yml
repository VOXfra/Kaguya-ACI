name: PS5Native v20.4 Image Mapping Windows CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  image-mapping:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run v20.4 Windows mapping contract
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc ci\ps5native-v20.4\contract.cpp /Fe:%RUNNER_TEMP%\V204ImageMappingContract.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\V204ImageMappingContract.exe"
          if errorlevel 1 exit /b 1
      - name: Policy markers
        shell: powershell
        run: |
          Write-Host 'V204_REAL_STAGE=HOST_PRECONSTRUCTION'
          Write-Host 'V204_NEXT_REAL_STAGE=PS5_IMAGE_MAPPED'
          Write-Host 'V204_BASELINE_PERCENT=86.0'
          Write-Host 'V204_SYNTHETIC_MAPPING_CREDIT=0'
          Write-Host 'V204_WINDOWS_IMAGE_MAPPING_OK'
