name: VoxTerra Foundation Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxterra-foundation
          fetch-depth: 0
      - name: Notice
        run: echo "Foundation source has already been bootstrapped into voxterra/. This workflow is retained only for historical/manual recovery."
