name: MultiTCG build

on:
  workflow_dispatch:
  push:
    branches: ["build/multitcg-cardshop-v0.1"]
    paths:
      - "multitcg/**"
      - ".github/workflows/multitcg-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download BepInEx and Unity compile references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps /tmp/bep /tmp/unity
          curl -fL --retry 3 -o /tmp/bep.zip "https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.2/BepInEx_win_x64_5.4.23.2.zip"
          unzip -q /tmp/bep.zip -d /tmp/bep
          cp /tmp/bep/BepInEx/core/BepInEx.dll deps/

          curl -fL --retry 3 -o /tmp/unity.zip "https://unity.bepinex.dev/libraries/2021.3.38.zip"
          unzip -q /tmp/unity.zip -d /tmp/unity
          for dll in UnityEngine.dll UnityEngine.CoreModule.dll UnityEngine.UIModule.dll UnityEngine.TextRenderingModule.dll UnityEngine.UI.dll; do
            src="$(find /tmp/unity -name "$dll" | head -1)"
            test -n "$src"
            cp "$src" deps/
          done
          ls -lh deps

      - name: Compile MultiTCG
        run: dotnet build multitcg/src/MultiTCG.Core/MultiTCG.Core.csproj -c Release

      - name: Assemble native Phone Overhaul package
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pillow
          ROOT="build/package/BepInEx/plugins/MultiTCG"
          ICONDIR="build/package/BepInEx/plugins/Phone - Overhaul/App Images/MultiTCG"
          mkdir -p "$ROOT/Data" "$ICONDIR"
          cp multitcg/src/MultiTCG.Core/bin/Release/netstandard2.0/MultiTCG.Core.dll "$ROOT/"
          cp multitcg/content/Data/*.mtcg "$ROOT/Data/"

          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('build/package/BepInEx/plugins/Phone - Overhaul/App Images/MultiTCG/MultiTCG.png')
          p.parent.mkdir(parents=True, exist_ok=True)
          im=Image.new('RGBA',(256,256),(0,0,0,0))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((18,18,238,238), radius=52, fill=(30,33,42,255))
          d.rounded_rectangle((55,43,201,213), radius=22, fill=(109,91,255,255))
          d.rectangle((77,70,179,88), fill=(245,245,248,255))
          d.rectangle((77,103,179,121), fill=(245,245,248,255))
          d.rectangle((77,136,146,154), fill=(245,245,248,255))
          im.save(p)
          PY

          cat > "$ROOT/README-MultiTCG.txt" <<'EOF'
          MultiTCG v0.3.0 - Native Phone UI
          ==================================

          CHANGES FROM v0.2
          -----------------
          - Removed the desktop/IMGUI window completely.
          - Removed the F8 fallback completely.
          - MultiTCG opens ONLY by tapping its Phone - Overhaul app icon.
          - The app builds its UI as a child of the active Phone Overhaul screen/container,
            so the content stays inside the smartphone instead of covering the game screen.
          - Back button closes only the MultiTCG page and reveals the phone home screen again.
          - Store, Collection and Language views remain available inside the phone app.
          - No Enhanced Prefab Loader dependency.
          - No Tetramon/base card replacement or patching.

          REQUIREMENTS
          ------------
          - BepInEx 5.4.23.x
          - Phone - Overhaul 1.7.x (required for this build)

          INSTALL
          -------
          Delete/overwrite the previous BepInEx/plugins/MultiTCG folder, then extract this ZIP
          into the TCG Card Shop Simulator root folder and merge BepInEx.

          TEST
          ----
          Open the in-game smartphone and tap MultiTCG. No separate desktop-style window should
          appear. The MultiTCG page should occupy the phone screen while leaving the phone frame visible.

          If tapping the icon does nothing, send BepInEx/LogOutput.log. v0.3 logs the resolved phone
          hierarchy so the container can be targeted exactly on your Phone Overhaul build.
          EOF

          test -f "$ROOT/MultiTCG.Core.dll"
          test -f "$ROOT/Data/starter_catalog.mtcg"
          test -f "$ICONDIR/MultiTCG.png"
          ! grep -R "KeyCode.F8\|GUI.Window\|OnGUI" -n multitcg/src/MultiTCG.Core/MultiTcgPhoneNativePlugin.cs
          ! find build/package -type f | grep -qi 'prefabloader'
          ! find build/package -type f | grep -Eqi 'resources\.assets|sharedassets|Assembly-CSharp'

          cd build/package
          zip -qr ../MultiTCG_v0.3.0.zip .
          cd ..
          unzip -l MultiTCG_v0.3.0.zip
          sha256sum MultiTCG_v0.3.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MultiTCG-v0.3.0
          path: build/MultiTCG_v0.3.0.zip
          if-no-files-found: error
