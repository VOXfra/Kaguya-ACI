name: VoxTerra CI
on:
  push:
    branches: ["voxterra-v0.1-ci"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore VoxTerra source
        run: |
          mkdir -p voxterra-build
          base64 -d .ci/voxterra-src.tar.gz.b64 > /tmp/voxterra-src.tar.gz
          tar -xzf /tmp/voxterra-src.tar.gz -C voxterra-build
          python3 - <<'PY'
          from pathlib import Path
          root = Path('voxterra-build/src/main/java/fr/voxterra')
          p = root / 'season/SeasonalWeather.java'
          s = p.read_text()
          s = s.replace('import net.minecraft.world.level.Heightmap;', 'import net.minecraft.world.level.levelgen.Heightmap;')
          s = s.replace('ClimateEngine.sample(level.getDayTime(), x, topY - 1, z)', 'ClimateEngine.sample(WorldTime.ticks(level), x, topY - 1, z)')
          p.write_text(s)
          p = root / 'VoxTerra.java'
          s = p.read_text()
          s = s.replace('import fr.voxterra.season.SeasonalWeather;', 'import fr.voxterra.season.SeasonalWeather;\nimport fr.voxterra.season.WorldTime;')
          s = s.replace('source.getLevel().getDayTime()', 'WorldTime.ticks(source.getLevel())')
          s = s.replace('ctx.getSource().getLevel().getDayTime()', 'WorldTime.ticks(ctx.getSource().getLevel())')
          p.write_text(s)
          (root / 'season/WorldTime.java').write_text('''package fr.voxterra.season;\n\nimport net.minecraft.server.level.ServerLevel;\n\npublic final class WorldTime {\n    private WorldTime() {}\n    public static long ticks(ServerLevel level) {\n        return level.dimensionType().defaultClock()\n                .map(clock -> level.clockManager().getTotalTicks(clock))\n                .orElseGet(level::getGameTime);\n    }\n}\n''')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        working-directory: voxterra-build
        run: gradle clean build --stacktrace
      - name: Boot realistic world
        working-directory: voxterra-build
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-type=voxterra:realistic
          level-seed=123456789
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          EOF
          rm -rf run/world
          set +e
          gradle runServer --args='nogui' > /tmp/voxterra-server.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 120); do
            if [ -f run/logs/latest.log ] && grep -q 'Done (' run/logs/latest.log; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          pkill -f 'net.fabricmc.loader.impl.launch.knot.KnotServer' 2>/dev/null || true
          cat /tmp/voxterra-server.log || true
          if [ -f run/logs/latest.log ]; then tail -n 250 run/logs/latest.log; fi
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: voxterra-v0.1-build
          path: voxterra-build/build/libs/*.jar
