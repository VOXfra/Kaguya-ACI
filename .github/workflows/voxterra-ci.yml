name: VoxTerra CI
on:
  push:
    branches: ["voxterra-v0.1-ci"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore VoxTerra 0.1.1 source
        run: |
          cat .ci/vt011.part00 .ci/vt011.part01 .ci/vt011.part02 .ci/vt011.part03 > /tmp/voxterra-src.tar.gz.b64
          base64 -d /tmp/voxterra-src.tar.gz.b64 > /tmp/voxterra-src.tar.gz
          mkdir -p voxterra-build
          tar -xzf /tmp/voxterra-src.tar.gz -C voxterra-build
          cp .ci/GeoEngine-perf2.java voxterra-build/src/main/java/fr/voxterra/geo/GeoEngine.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('voxterra-build/src/main/java/fr/voxterra/geo/HydroCache.java')
          s = p.read_text()
          s = s.replace('double h = GeoEngine.baseHeight(x, z);', 'double h = GeoEngine.baseHeightRaw(x, z);')
          s = s.replace('double lat = GeoEngine.latitude(z);\n                    double moisture = GeoEngine.moistureAt(x, z, h, lat);\n                    accumulation[idx] = h <= GeoEngine.SEA_LEVEL ? 0.15 : 0.55 + moisture * 0.9;', 'double rainfall = GeoEngine.drainageRainfall(x, z, h);\n                    accumulation[idx] = h <= GeoEngine.SEA_LEVEL ? 0.15 : 0.55 + rainfall * 0.9;')
          p.write_text(s)
          p = Path('voxterra-build/src/main/java/fr/voxterra/worldgen/VoxTerraBiomeSource.java')
          s = p.read_text().replace('double slope = GeoEngine.slope(x, z);', 'double slope = g.slope01() * 85.0;')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        working-directory: voxterra-build
        run: gradle clean build --stacktrace
      - name: Generate 256 chunks
        working-directory: voxterra-build
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-type=voxterra:realistic
          level-seed=123456789
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          EOF
          rm -rf run/world
          set +e
          (
            for i in $(seq 1 90); do
              if [ -f run/logs/latest.log ] && grep -q 'Done (' run/logs/latest.log; then break; fi
              sleep 1
            done
            echo 'forceload add -128 -128 127 127'
            sleep 60
            echo 'save-all flush'
            sleep 5
            echo 'stop'
          ) | timeout 150s gradle runServer --args='nogui' > /tmp/voxterra-server.log 2>&1
          status=$?
          set -e
          cat /tmp/voxterra-server.log
          if [ -f run/logs/latest.log ]; then tail -n 400 run/logs/latest.log; fi
          test -f run/logs/latest.log
          grep -q 'Done (' run/logs/latest.log
          ! grep -qiE 'OutOfMemoryError|crash report|watchdog' run/logs/latest.log
          test -d run/world/region
          region_count=$(find run/world/region -name '*.mca' | wc -l)
          echo "Region files generated: $region_count"
          test "$region_count" -ge 1
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: voxterra-v0.1.1-build
          path: voxterra-build/build/libs/*.jar
