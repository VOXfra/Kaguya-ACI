name: Build VOX Mini Games APK

on:
  push:
    branches: ["mobile-minigames"]
    paths:
      - "mobile-minigames/**"
      - ".github/workflows/mobile-minigames-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Tests + APK debug
        run: gradle -p mobile-minigames test assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-Mini-Games-v0.1-debug
          path: mobile-minigames/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
