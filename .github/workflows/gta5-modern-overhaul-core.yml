name: GTA5 Modern Overhaul Core CI

on:
  push:
    branches:
      - gta5-modern-world-overhaul
    paths:
      - "projects/gta5-modern-overhaul/**"
      - ".github/workflows/gta5-modern-overhaul-core.yml"
  pull_request:
    paths:
      - "projects/gta5-modern-overhaul/**"
      - ".github/workflows/gta5-modern-overhaul-core.yml"

permissions:
  contents: read

jobs:
  core-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S projects/gta5-modern-overhaul -B projects/gta5-modern-overhaul/build -DVOX_BUILD_TESTS=ON -DVOX_BUILD_RUNTIME=ON -DVOX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build projects/gta5-modern-overhaul/build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir projects/gta5-modern-overhaul/build -C Release --output-on-failure

  core-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ASan + UBSan
        run: >-
          cmake -S projects/gta5-modern-overhaul
          -B projects/gta5-modern-overhaul/build-sanitized
          -DVOX_BUILD_TESTS=ON
          -DVOX_BUILD_RUNTIME=OFF
          -DVOX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build ASan + UBSan
        run: cmake --build projects/gta5-modern-overhaul/build-sanitized --parallel 2

      - name: Test ASan + UBSan
        run: ctest --test-dir projects/gta5-modern-overhaul/build-sanitized --output-on-failure

  runtime-package:
    runs-on: windows-latest
    needs: [core-build-test, core-sanitizers]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for visual pipeline regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned FiveFury tooling dependency
        run: python -m pip install --disable-pip-version-check --no-input fivefury==0.4.21

      - name: Validate visual pipeline Python and Enhanced YDR rewrite
        shell: pwsh
        run: |
          python -m py_compile ./projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py
          if ($LASTEXITCODE -ne 0) { throw "Visual probe Python syntax validation failed." }
          python ./projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py self-test
          if ($LASTEXITCODE -ne 0) { throw "Visual probe FiveFury/Gen9 self-test failed." }

          $expected = 'newmods/platform/levels/gta5/props/vegetation/v_trees.rpf/prop_tree_cedar_02.ydr'
          $output = python -c "import importlib.util, pathlib; p=pathlib.Path(r'projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py'); s=importlib.util.spec_from_file_location('vp',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.rageopenv_platform_mirror_relative('x64i.rpf/levels/gta5/props/vegetation/v_trees.rpf/prop_tree_cedar_02.ydr').as_posix())"
          if ($LASTEXITCODE -ne 0 -or $output.Trim() -ne $expected) { throw "RageOpenV platform mirror mapping regression: '$output'" }

      - name: Parse visual pipeline PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            './projects/gta5-modern-overhaul/tools/assets/Setup-And-Install-VisualProbe.ps1',
            './projects/gta5-modern-overhaul/tools/assets/Rollback-VisualProbe.ps1'
          )
          foreach ($script in $scripts) {
            $content = Get-Content -LiteralPath $script -Raw
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser errors in $script : $messages"
            }
          }

      - name: Execute visual installer environment bootstrap on Windows
        shell: pwsh
        run: |
          $venv = './projects/gta5-modern-overhaul/tools/.venv-assets'
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -LiteralPath $venv -Recurse -Force
          }

          & ./projects/gta5-modern-overhaul/tools/assets/Setup-And-Install-VisualProbe.ps1 -EnvironmentOnly
          if ($LASTEXITCODE -ne 0) {
            throw "The exact packaged installer environment path failed with exit code $LASTEXITCODE."
          }

          $venvPython = Join-Path $venv 'Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw "Installer smoke did not create the expected venv Python executable."
          }
          $versionLines = @(& $venvPython -c 'import sys; print(sys.version.split()[0])')
          if ($LASTEXITCODE -ne 0 -or $versionLines.Count -lt 1 -or [string]::IsNullOrWhiteSpace($versionLines[-1].ToString())) {
            throw "Installer-created venv could not execute the same Python version query used by the package."
          }
          & $venvPython ./projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Installer-created venv failed the Gen9 transformer self-test."
          }
          Write-Host "PASS: real PowerShell -> venv -> version query -> FiveFury -> Gen9 self-test bootstrap executed."

      - name: Configure runtime x64
        run: cmake -S projects/gta5-modern-overhaul -B projects/gta5-modern-overhaul/build-runtime -A x64 -DVOX_BUILD_TESTS=OFF -DVOX_BUILD_RUNTIME=ON -DVOX_WARNINGS_AS_ERRORS=ON

      - name: Build runtime ASI, core DLL, fake ScriptHookV and smoke host
        run: cmake --build projects/gta5-modern-overhaul/build-runtime --config Release --target vox_modern_overhaul_asi vox_modern_core vox_fake_scripthookv vox_runtime_smoke_host --parallel 2

      - name: Verify runtime PE dependency boundary
        shell: pwsh
        run: |
          $asi = Resolve-Path ./projects/gta5-modern-overhaul/build-runtime/Release/VOXModernOverhaul.asi
          $bytes = [System.IO.File]::ReadAllBytes($asi)
          if ($bytes.Length -lt 512) { throw "ASI is unexpectedly small/truncated." }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "ASI missing MZ signature." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 160) -ge $bytes.Length) { throw "Invalid PE header offset." }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45 -or $bytes[$peOffset+2] -ne 0 -or $bytes[$peOffset+3] -ne 0) { throw "ASI missing PE signature." }
          $optional = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optional)
          if ($magic -ne 0x20B) { throw "ASI is not PE32+ x64 optional-header format." }
          $entryRva = [BitConverter]::ToUInt32($bytes, $optional + 16)
          if ($entryRva -eq 0) { throw "ASI custom entrypoint RVA is zero." }
          $dataDirectories = $optional + 112
          $importRva = [BitConverter]::ToUInt32($bytes, $dataDirectories + 8)
          $importSize = [BitConverter]::ToUInt32($bytes, $dataDirectories + 12)
          if ($importRva -eq 0 -or $importSize -eq 0) { throw "ASI should import its explicit Kernel32 boundary." }
          $tlsRva = [BitConverter]::ToUInt32($bytes, $dataDirectories + (9 * 8))
          $tlsSize = [BitConverter]::ToUInt32($bytes, $dataDirectories + (9 * 8) + 4)
          if ($tlsRva -ne 0 -or $tlsSize -ne 0) { throw "ASI unexpectedly contains a TLS directory." }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere.exe not found." }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "No Visual Studio installation with x64 VC tools was found." }
          $dumpbinCandidates = @(Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Tools\MSVC') -Filter dumpbin.exe -File -Recurse | Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Sort-Object FullName -Descending)
          if ($dumpbinCandidates.Count -lt 1) { throw "Could not locate x64 dumpbin.exe under '$vsInstall'." }
          $dumpbin = $dumpbinCandidates[0].FullName
          Write-Host "Using dumpbin: $dumpbin"

          $imports = (& $dumpbin /nologo /imports $asi) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed with exit code $LASTEXITCODE" }
          if ($imports -notmatch '(?i)KERNEL32\.dll') { throw "ASI does not import KERNEL32.dll as expected." }
          if ($imports -match '(?i)VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase|ScriptHookV\.dll') {
            throw "ASI import boundary violation: CRT/C++ runtime or direct ScriptHookV import detected.`n$imports"
          }
          $required = @('GetModuleHandleW','GetProcAddress','GetModuleFileNameW','CreateDirectoryW','GetLastError','CreateFileW','WriteFile','FlushFileBuffers','CloseHandle','LoadLibraryW','FreeLibrary')
          foreach ($name in $required) {
            if ($imports -notmatch [regex]::Escape($name)) { throw "Expected Kernel32 import missing: $name" }
          }
          Write-Host "PASS: ASI remains CRT-free and only loads the C++ core from ScriptMain."

      - name: Run synthetic ScriptHookV plus persistent core checkpoint twice
        shell: pwsh
        run: |
          $runtime = Resolve-Path ./projects/gta5-modern-overhaul/build-runtime/Release
          $stateRoot = Join-Path $runtime "VOXModernOverhaul\state"
          if (Test-Path -LiteralPath $stateRoot) { Remove-Item -LiteralPath $stateRoot -Recurse -Force }

          & (Join-Path $runtime "gta5_enhanced.exe")
          if ($LASTEXITCODE -ne 0) { throw "First ScriptHookV/persistence smoke process failed with exit code $LASTEXITCODE" }

          & (Join-Path $runtime "gta5_enhanced.exe")
          if ($LASTEXITCODE -ne 0) { throw "Second fresh-process persistence restore failed with exit code $LASTEXITCODE" }

      - name: Package checkpoint
        shell: pwsh
        run: >-
          ./projects/gta5-modern-overhaul/tools/PackageCheckpoint.ps1
          -BuildDirectory ./projects/gta5-modern-overhaul/build-runtime
          -OutputDirectory ./projects/gta5-modern-overhaul/dist
          -Version 0.0.1-dev.15.1
          -Commit $env:GITHUB_SHA

      - name: Verify package contents and visual-tool boundary
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem ./projects/gta5-modern-overhaul/dist -Filter "VOX-GTA5-Modern-Overhaul-*.zip" -File)
          if ($zip.Count -ne 1) { throw "Expected exactly one checkpoint ZIP, found $($zip.Count)." }
          $extract = Join-Path $env:RUNNER_TEMP "vox-package-verify"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $extract
          $required = @(
            "VOXModernOverhaul.asi",
            "VOXModernCore.dll",
            "VOXModernOverhaul/config/core.cfg",
            "VOXModernOverhaul/tools/assets/vox_visual_probe.py",
            "VOXModernOverhaul/tools/assets/Setup-And-Install-VisualProbe.ps1",
            "VOXModernOverhaul/tools/assets/Rollback-VisualProbe.ps1",
            "VOXModernOverhaul/tools/assets/01_INSTALL_VISUAL_PROBE.cmd",
            "VOXModernOverhaul/tools/assets/02_OPEN_VISUAL_PROBE_REPORT.cmd",
            "VOXModernOverhaul/tools/assets/03_ROLLBACK_VISUAL_PROBE.cmd",
            "README_FIRST_TEST.txt",
            "BUILD_INFO.txt"
          )
          foreach ($relative in $required) {
            $path = Join-Path $extract $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Package missing required file: $relative"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $extract "ScriptHookV.dll")) {
            throw "Package must never redistribute the test fake or user's ScriptHookV.dll."
          }
          if (Test-Path -LiteralPath (Join-Path $extract "VOXModernOverhaul/state/world_state.v1")) {
            throw "Package must never ship CI-generated persistent user state."
          }
          if (Test-Path -LiteralPath (Join-Path $extract "VOXModernOverhaul/tools/.venv-assets")) {
            throw "Package must not redistribute the local Python/FiveFury environment."
          }
          if (Test-Path -LiteralPath (Join-Path $extract "VOXModernOverhaul/visual_probe")) {
            throw "Package must not ship extracted/generated user assets or visual-probe state."
          }
          $shippedYdr = @(Get-ChildItem -LiteralPath $extract -Filter '*.ydr' -File -Recurse)
          if ($shippedYdr.Count -ne 0) {
            throw "Package must never redistribute Rockstar or CI-generated YDR assets."
          }
          $buildInfo = Get-Content -LiteralPath (Join-Path $extract 'BUILD_INFO.txt') -Raw
          if ($buildInfo -notmatch 'version=0\.0\.1-dev\.15\.1') {
            throw "BUILD_INFO does not identify dev.15.1."
          }
          if ($buildInfo -notmatch 'visual_probe_fivefury=0\.4\.21') {
            throw "BUILD_INFO does not pin FiveFury 0.4.21."
          }
          $readme = Get-Content -LiteralPath (Join-Path $extract 'README_FIRST_TEST.txt') -Raw
          if ($readme -notmatch 'Version: 0\.0\.1-dev\.15\.1') {
            throw "Packaged README does not identify dev.15.1."
          }

      - name: Upload GTA-ready checkpoint ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VOX-GTA5-Modern-Overhaul-0.0.1-dev.15.1
          path: projects/gta5-modern-overhaul/dist/VOX-GTA5-Modern-Overhaul-0.0.1-dev.15.1.zip
          if-no-files-found: error
          retention-days: 30
