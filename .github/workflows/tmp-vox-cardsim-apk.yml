name: Build VOX CardSim APK

on:
  push:
    branches:
      - tmp-vox-cardsim-apk-build
    paths:
      - 'cardsim-build/**'
      - '.github/workflows/tmp-vox-cardsim-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cardsim-build/**'
      - '.github/workflows/tmp-vox-cardsim-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: cardsim-build
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-151-v0.1-APK
          path: cardsim-build/app/build/outputs/apk/debug/app-debug.apk
