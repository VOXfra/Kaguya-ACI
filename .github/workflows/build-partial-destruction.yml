name: Build Partial Destruction

on:
  push:
    branches:
      - partial-destruction-build
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partial-destruction-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Forge mod
        run: gradle build --stacktrace

      - name: Stage JAR
        run: |
          mkdir -p ../artifacts
          cp build/libs/partialdestruction-0.1.0.jar ../artifacts/PartialDestruction-0.1.0-Forge-1.20.1.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartialDestruction-0.1.0-Forge-1.20.1
          path: artifacts/PartialDestruction-0.1.0-Forge-1.20.1.jar

      - name: Commit built JAR to build branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/PartialDestruction-0.1.0-Forge-1.20.1.jar
          git commit -m "Build Partial Destruction 0.1.0" || exit 0
          git push
