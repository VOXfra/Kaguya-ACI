name: PS5Native v19.0 EKPFS Boundary Windows CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  ekpfs-boundary:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate KDF, wrapped-slot and RIF contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python ci\ps5native-v19.0\boundary-contract.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Independent AES-XTS known-answer check
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check cryptography==46.0.4
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          python ci\ps5native-v19.0\xts-independent.py
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: PowerShell 5.1 focused runner contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $s=Get-Content ci\ps5native-v19.0\runner-contract.ps1 -Raw
          [void][scriptblock]::Create($s)
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ci\ps5native-v19.0\runner-contract.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Policy markers
        shell: powershell
        run: |
          Write-Host 'V190_SCOPE=EKPFS_FRONTIER_ONLY'
          Write-Host 'V190_BASELINE_PERCENT=86.0'
          Write-Host 'V190_BRUTEFORCE_ALLOWED=0'
          Write-Host 'V190_RAW_WRAPPED_KEY_EXPORT_ALLOWED=0'
          Write-Host 'V190_PC_RUNTIME_DEPENDENCY_ALLOWED=0'
          Write-Host 'V190_REAL_GATE_REQUIRED=4_OF_4'
          Write-Host 'V190_WINDOWS_EKPFS_BOUNDARY_CONTRACT_OK'
