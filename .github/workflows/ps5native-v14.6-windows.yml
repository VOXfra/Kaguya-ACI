name: PS5Native v14.6 Windows Compile CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  visible-native-runtime-windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v14.5 mini baseline
        shell: pwsh
        run: |
          $parts = Get-ChildItem -LiteralPath "ci/ps5native-v14.5/chunks" -File -Filter "part-*" | Sort-Object Name
          if ($parts.Count -ne 23) { throw "Expected 23 v14.5 baseline chunks, got $($parts.Count)" }
          $b64 = [System.Text.StringBuilder]::new()
          foreach ($p in $parts) {
            [void]$b64.Append((Get-Content -LiteralPath $p.FullName -Raw).Trim())
          }
          $bytes = [Convert]::FromBase64String($b64.ToString())
          $zip = Join-Path $env:RUNNER_TEMP "v145-min2.zip"
          [IO.File]::WriteAllBytes($zip, $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sha -ne "f2491eea05363624805819eb16842ff157a179f8815c298b1776ac29a6df0ae7") {
            throw "v14.5 baseline SHA256 mismatch: $sha"
          }
          $extract = Join-Path $env:RUNNER_TEMP "v146-src"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $src = Join-Path $extract "v145-min2"
          if (-not (Test-Path -LiteralPath (Join-Path $src "CMakeLists.txt"))) {
            throw "Missing reconstructed v14.5 CMakeLists.txt"
          }
          "V146_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify and apply exact v14.6 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE="$RUNNER_TEMP/v146.patch"
          python - <<'PY'
          from pathlib import Path
          import os
          parts = sorted(Path("ci/ps5native-v14.6/patch").glob("part-*"))
          text = "".join(p.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n") for p in parts)
          Path(os.environ["RUNNER_TEMP"], "v146.patch").write_text(text, encoding="utf-8", newline="\n")
          PY
          got="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          expected="4f3429a8178fcf052e926386bf967b9cae3dd264176dedac4ad67485bdfbd04e"
          test "$got" = "$expected" || { echo "v14.6 patch SHA mismatch: $got"; exit 1; }
          command -v patch
          patch --batch --forward -p1 -d "$V146_SRC" < "$PATCH_FILE"

      - name: Verify exact v14.6 source manifest
        shell: pwsh
        run: |
          $script = @'
          import hashlib
          from pathlib import Path
          import os
          root = Path(os.environ["V146_SRC"])
          rows = []
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  rel = p.relative_to(root).as_posix()
                  rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}\n")
          manifest = "".join(rows).encode()
          got = hashlib.sha256(manifest).hexdigest()
          expected = "20ab792aa904324b3362f59b79646815fc7ab04b829cbb49bd6555fa77c274a9"
          print(f"files={len(rows)}")
          print(f"manifest_sha256={got}")
          if len(rows) != 28 or got != expected:
              raise SystemExit(f"v14.6 source manifest mismatch: files={len(rows)} sha={got}")
          print("V146_EXACT_SOURCE_MANIFEST_OK")
          '@
          $script | python -

      - name: Configure exact v14.6 source with VS2022
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "v146-build"
          cmake -S "$env:V146_SRC" -B "$build" -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "V146_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build visible native runtime with MSVC
        shell: pwsh
        run: |
          cmake --build "$env:V146_BUILD" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify visible runtime probe binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath "$env:V146_BUILD" -Filter "AgcVisibleRuntimeProbe.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $exe) { throw "AgcVisibleRuntimeProbe.exe was not produced" }
          Write-Host "V146_WINDOWS_MSVC_BUILD_OK"
          Write-Host "Probe: $($exe.FullName)"
          Write-Host "Visible HWND / waitable DXGI / hardware-backed 48-frame execution intentionally deferred to the user's Windows GPU run."
