name: GTA5 Modern Overhaul dev15.3

on:
  push:
    branches:
      - gta5-modern-world-overhaul
    paths:
      - "projects/gta5-modern-overhaul/**"
      - ".github/workflows/gta5-modern-overhaul-dev153.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev153-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned FiveFury
        run: python -m pip install --disable-pip-version-check --no-input fivefury==0.4.21

      - name: Validate visual and archive mirror Python tools
        shell: pwsh
        run: |
          python -m py_compile ./projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py
          if ($LASTEXITCODE -ne 0) { throw "vox_visual_probe.py syntax validation failed." }
          python -m py_compile ./projects/gta5-modern-overhaul/tools/assets/vox_archive_mirror_probe.py
          if ($LASTEXITCODE -ne 0) { throw "vox_archive_mirror_probe.py syntax validation failed." }
          python ./projects/gta5-modern-overhaul/tools/assets/vox_visual_probe.py self-test
          if ($LASTEXITCODE -ne 0) { throw "Original Gen9 visual probe self-test failed." }
          python ./projects/gta5-modern-overhaul/tools/assets/vox_archive_mirror_probe.py self-test
          if ($LASTEXITCODE -ne 0) { throw "Complete nested-RPF mirror self-test failed." }

      - name: Parse new PowerShell wrappers
        shell: pwsh
        run: |
          $scripts = @(
            './projects/gta5-modern-overhaul/tools/assets/Install-FullArchiveIdentityProbe.ps1',
            './projects/gta5-modern-overhaul/tools/assets/Enable-FullArchiveTransformedProbe.ps1',
            './projects/gta5-modern-overhaul/tools/assets/Rollback-FullArchiveProbe.ps1'
          )
          foreach ($script in $scripts) {
            $content = Get-Content -LiteralPath $script -Raw
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser errors in $script : $messages"
            }
          }

      - name: Configure runtime x64
        run: cmake -S projects/gta5-modern-overhaul -B projects/gta5-modern-overhaul/build-dev153 -A x64 -DVOX_BUILD_TESTS=OFF -DVOX_BUILD_RUNTIME=ON -DVOX_WARNINGS_AS_ERRORS=ON

      - name: Build runtime and synthetic host
        run: cmake --build projects/gta5-modern-overhaul/build-dev153 --config Release --target vox_modern_overhaul_asi vox_modern_core vox_fake_scripthookv vox_runtime_smoke_host --parallel 2

      - name: Run persistent runtime smoke twice
        shell: pwsh
        run: |
          $runtime = Resolve-Path ./projects/gta5-modern-overhaul/build-dev153/Release
          $stateRoot = Join-Path $runtime 'VOXModernOverhaul\state'
          if (Test-Path -LiteralPath $stateRoot) { Remove-Item -LiteralPath $stateRoot -Recurse -Force }
          & (Join-Path $runtime 'gta5_enhanced.exe')
          if ($LASTEXITCODE -ne 0) { throw "First runtime smoke failed: $LASTEXITCODE" }
          & (Join-Path $runtime 'gta5_enhanced.exe')
          if ($LASTEXITCODE -ne 0) { throw "Second runtime smoke failed: $LASTEXITCODE" }

      - name: Package dev15.3
        shell: pwsh
        run: >-
          ./projects/gta5-modern-overhaul/tools/PackageCheckpoint.ps1
          -BuildDirectory ./projects/gta5-modern-overhaul/build-dev153
          -OutputDirectory ./projects/gta5-modern-overhaul/dist-dev153
          -Version 0.0.1-dev.15.3
          -Commit $env:GITHUB_SHA

      - name: Verify dev15.3 package
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem ./projects/gta5-modern-overhaul/dist-dev153 -Filter 'VOX-GTA5-Modern-Overhaul-0.0.1-dev.15.3.zip' -File)
          if ($zip.Count -ne 1) { throw "Expected one dev15.3 ZIP, found $($zip.Count)." }
          $extract = Join-Path $env:RUNNER_TEMP 'vox-dev153-package'
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $extract
          $required = @(
            'VOXModernOverhaul.asi',
            'VOXModernCore.dll',
            'VOXModernOverhaul/config/core.cfg',
            'VOXModernOverhaul/tools/assets/vox_visual_probe.py',
            'VOXModernOverhaul/tools/assets/vox_archive_mirror_probe.py',
            'VOXModernOverhaul/tools/assets/Install-FullArchiveIdentityProbe.ps1',
            'VOXModernOverhaul/tools/assets/Enable-FullArchiveTransformedProbe.ps1',
            'VOXModernOverhaul/tools/assets/Rollback-FullArchiveProbe.ps1',
            'VOXModernOverhaul/tools/assets/05_INSTALL_FULL_ARCHIVE_IDENTITY.cmd',
            'VOXModernOverhaul/tools/assets/06_ENABLE_SCALED_PROBE.cmd',
            'VOXModernOverhaul/tools/assets/07_ROLLBACK_FULL_ARCHIVE_PROBE.cmd',
            'README_FIRST_TEST.txt',
            'BUILD_INFO.txt'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract $relative) -PathType Leaf)) {
              throw "Package missing: $relative"
            }
          }
          $buildInfo = Get-Content -LiteralPath (Join-Path $extract 'BUILD_INFO.txt') -Raw
          if ($buildInfo -notmatch 'version=0\.0\.1-dev\.15\.3') { throw 'BUILD_INFO version mismatch.' }
          if ($buildInfo -notmatch 'archive_mirror_probe_sha256=[0-9a-f]{64}') { throw 'Archive mirror tool hash missing.' }
          $readme = Get-Content -LiteralPath (Join-Path $extract 'README_FIRST_TEST.txt') -Raw
          if ($readme -notmatch 'Version: 0\.0\.1-dev\.15\.3') { throw 'README version mismatch.' }
          $shippedAssets = @(Get-ChildItem -LiteralPath $extract -File -Recurse | Where-Object { $_.Extension -in @('.ydr','.rpf') })
          if ($shippedAssets.Count -ne 0) { throw 'Package must not redistribute Rockstar YDR/RPF files.' }
          if (Test-Path -LiteralPath (Join-Path $extract 'VOXModernOverhaul/visual_probe')) { throw 'Package must not ship user visual-probe state.' }

      - name: Upload GTA-ready dev15.3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VOX-GTA5-Modern-Overhaul-0.0.1-dev.15.3
          path: projects/gta5-modern-overhaul/dist-dev153/VOX-GTA5-Modern-Overhaul-0.0.1-dev.15.3.zip
          if-no-files-found: error
          retention-days: 30
