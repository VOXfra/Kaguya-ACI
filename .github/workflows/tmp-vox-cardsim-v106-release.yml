name: VOX CardSim V1.0.8 Retail Archives Mode Fix Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'cardsim-v03/**'
      - '.github/workflows/tmp-vox-cardsim-v106-release.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Generate validated embedded card data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cardsim-v03/app/src/main/assets/img
          python cardsim-v03/tools/generate_v110_data.py
          python cardsim-v03/tools/generate_v105_catalog.py
          A=cardsim-v03/app/src/main/assets
          curl -Lf --retry 3 'https://archives.bulbagarden.net/media/upload/thumb/1/1f/S6a_Eevee_Heroes_Logo.png/1200px-S6a_Eevee_Heroes_Logo.png' -o "$A/img/eevee_logo.png"
          curl -Lf --retry 3 'https://tcgplayer-cdn.tcgplayer.com/product/565350_400w.jpg' -o "$A/img/eevee_booster.jpg"
          curl -Lf --retry 3 'https://tcgplayer-cdn.tcgplayer.com/product/565351_400w.jpg' -o "$A/img/eevee_box.jpg"
          curl -Lf --retry 3 'https://d2j6dbq0eux0bg.cloudfront.net/images/51000416/4098527801.jpg' -o "$A/img/binder_151.jpg"
          curl -Lf --retry 3 'https://matraws.dk/cdn/shop/files/ultra-pro-charizard-pokemon-obsidian-flames-9-pocket-portfolio-mappe-kortspil-643.webp?crop=center&height=1200&v=1707377473&width=1200' -o "$A/img/binder_obsidian.webp"
          curl -Lf --retry 3 'https://kawaiicollector.com.au/cdn/shop/files/Paldea-Evolved-Portfolio-Large_1200x1200.png?v=1693561546' -o "$A/img/binder_paldea.png"
          curl -Lf --retry 3 'https://s3-ap-northeast-1.amazonaws.com/jiraffe-magi/prod/images/item/9644364/1.jpg' -o "$A/img/binder_eevee.jpg"

      - name: Validate V1.0.8 source and boot guard
        shell: bash
        run: |
          set -euo pipefail
          A=cardsim-v03/app/src/main/assets
          for f in "$A"/*.js; do node --check "$f"; done
          python - <<'PY'
          import json,re
          from pathlib import Path
          A=Path('cardsim-v03/app/src/main/assets')
          txt=(A/'v105_catalog_embed.js').read_text(encoding='utf-8')
          m=re.search(r'window\.V105_CATALOG=(.*);\s*$',txt,re.S); assert m
          d=json.loads(m.group(1))
          assert d['stats']['sets']==16,d['stats']
          assert d['stats']['cards']==3033,d['stats']
          assert d['stats']['masterSlots']==4882,d['stats']
          assert d['rotation2026']==['me02.5','me03','me04','me05']
          pre=(A/'v063pre.js').read_text(encoding='utf-8')
          expected="'v105_catalog_embed.js','v105catalog.js','v106fix.js','v106productart.js','v106memory.js','v107fix.js'"
          assert expected in pre,'V1.0.7 base layers are not explicitly ordered'
          assert 'voxCardSimV107_lastgood_' in pre and 'v107BootValidate' in pre
          index=(A/'index.html').read_text(encoding='utf-8')
          assert '<script src="v063pre.js"></script><script src="v108boot.js"></script>' in index
          boot=(A/'v108boot.js').read_text(encoding='utf-8')
          for token in ['V108_BOOT_SWITCH_MARKER','window.v108BootSwitchMode','v108BootInjectModeFallback','v108fix.js','__voxV108BootReady']:
              assert token in boot,token
          fix=(A/'v108fix.js').read_text(encoding='utf-8')
          for token in ["V108_VERSION='1.0.8'",'V108_RETAIL_YEAR=2026','V108_ARCHIVE_ONE_DAY_IN=8','v108ArchiveDay','v108InstallModePanel','Collection Archive','OFFRE ARCHIVE','V108_OPENING_PACK_ART','V108_BINDER_ART','marketHidden','shopHidden','v108OfflineManifestBase','v4MarketAssetResults=function']:
              assert token in fix,token
          pack=(A/'v105packpatch.js').read_text(encoding='utf-8')
          assert "createElement('script')" not in pack and 'v107RestoreBinderAfterCatalog' in pack
          mem=(A/'v106memory.js').read_text(encoding='utf-8')
          assert 'v106BuildMarketIndex()' not in mem,'market index still warmed at boot'
          v=(A/'v107fix.js').read_text(encoding='utf-8')
          for token in ['V107_VERSION=\'1.0.7\'','v107-year-row','v107RebuildOfflinePanel','cfg?.v105Catalog','Cloud : réservé au mode Réaliste','V107_LASTGOOD_PREFIX','document.hidden','v106ApplyProductArt']:
              assert token in v,token
          print('V1.0.8 retail/archive/products/mode source validation OK')
          PY
          grep -q 'versionCode = 34' cardsim-v03/app/build.gradle.kts
          grep -q 'versionName = "1.0.8"' cardsim-v03/app/build.gradle.kts

      - name: Runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');global.window=global;global.document={querySelectorAll:()=>[]};
          global.state={eventCatalog:{},marketTab:'buy'};global.v106MarketIndex=null;global.v106InvalidateMarket=()=>{};global.V061_BINDERS={me04:{image:''}};
          global.$=()=>({classList:{contains:()=>false}});global.renderProducts=()=>{};global.v4RenderBuyHome=()=>{};
          global.SETS={me04:{id:'me04',name:'Chaos Ascendant',v105Catalog:true,products:[{id:'b',mode:'loose',qty:1,kind:'Booster'},{id:'l',mode:'loose',qty:6,kind:'Lot de boosters'},{id:'e',mode:'sealed',opens:9,kind:'ETB'},{id:'d',mode:'sealed',opens:36,kind:'Booster Box'},{id:'c',mode:'binderUnlock',qty:1,kind:'Classeur'},{id:'x',mode:'sealed',opens:6,kind:'ÉDITION LIMITÉE',eventEdition:true}]}};
          global.v08DailyEvent=()=>({id:'evt',setId:'me04',name:'Édition limitée',mode:'sealed',opens:6,eventEdition:true});
          vm.runInThisContext(fs.readFileSync('cardsim-v03/app/src/main/assets/v106productart.js','utf8'));
          const imgs=SETS.me04.products.map(p=>p.image);if(!imgs.every(Boolean))throw new Error('missing product art');if(new Set(imgs).size!==imgs.length)throw new Error('product types share artwork');
          console.log('Product artwork base smoke test OK');
          NODE
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;
          global.document={createElement:()=>({textContent:'',appendChild(){}}),head:{appendChild(){}}};
          global.localStorage={m:new Map(),getItem(k){return this.m.get(k)||null},setItem(k,v){this.m.set(k,String(v))},removeItem(k){this.m.delete(k)}};
          var V08_DAY=86400000,V105_ROTATION_MS=900000,V08_MODES={realistic:{label:'Réaliste',desc:'r'},ludic:{label:'Ludique',desc:'l'},creative:{label:'Créatif',desc:'c'}};
          function v08Hash32(x){x=(Number(x)||0)|0;x=Math.imul(x^(x>>>16),0x45d9f3b);x=Math.imul(x^(x>>>16),0x45d9f3b);return(x^(x>>>16))>>>0}function v08SeededShuffle(a){return[...a]}
          var V061_BINDERS={};
          var SETS={
            old:{id:'old',name:'Ancienne',releaseYear:2025,products:[{id:'old-booster',mode:'loose',qty:1,price:7,image:'old-pack'},{id:'binder-old',mode:'binderUnlock',price:19.99}]},
            'me02.5':{id:'me02.5',name:'Héros Transcendants',releaseYear:2026,products:[{id:'me02.5-booster',mode:'loose',qty:1,price:6,image:'old-me25-pack'},{id:'me02.5-lot6',mode:'loose',qty:6,price:36,kind:'Lot de boosters',image:'bundle25'},{id:'me02.5-etb',mode:'sealed',opens:9,kind:'ETB',image:'etb25'},{id:'me02.5-display',mode:'sealed',opens:36,kind:'Booster Box',image:'fake-display'},{id:'binder-me02.5',mode:'binderUnlock',price:19.99,image:'placeholder'}]},
            me03:{id:'me03',name:'Équilibre Parfait',releaseYear:2026,products:[{id:'me03-booster',mode:'loose',qty:1,price:6,image:'shop3'},{id:'me03-lot6',mode:'loose',qty:6,price:36,kind:'Lot de boosters',image:'bundle3'},{id:'me03-display',mode:'sealed',opens:36,kind:'Booster Box',image:'display3'},{id:'binder-me03',mode:'binderUnlock',price:19.99,image:'placeholder'}]},
            me04:{id:'me04',name:'Chaos Ascendant',releaseYear:2026,products:[{id:'me04-booster',mode:'loose',qty:1,price:6,image:'shop4'},{id:'me04-lot6',mode:'loose',qty:6,price:36,kind:'Lot de boosters',image:'bundle4'},{id:'me04-display',mode:'sealed',opens:36,kind:'Booster Box',image:'display4'},{id:'binder-me04',mode:'binderUnlock',price:19.99,image:'placeholder'}]},
            me05:{id:'me05',name:'Nuit Noire',releaseYear:2026,products:[{id:'pbl-booster',mode:'loose',qty:1,price:6,image:'shop5'},{id:'pbl-lot6',mode:'loose',qty:6,price:36,kind:'Lot de boosters',image:'bundle5'},{id:'pbl-display',mode:'sealed',opens:36,kind:'Booster Box',image:'display5'},{id:'binder-me05',mode:'binderUnlock',price:19.99,image:'placeholder'}]}
          };
          var state={activeSet:'old',gameMode:'creative',eventCatalog:{}};
          function v08Mode(){return state.gameMode}function v090SetUnlocked(){return true}function renderProducts(){}function buyProduct(){return true}
          function productById(id){for(const s of Object.values(SETS)){const p=s.products.find(x=>x.id===id);if(p)return{...p,setId:s.id}}return null}
          function renderSettings(){}function save(){}function toast(){}function escapeHtml(x){return String(x)}function v08RefreshModePill(){}function $(sel){return null}
          function openingPackImage(setId){return'base-'+setId}
          function v08MarketAssets(){return[{type:'sealed',productId:'me02.5-display'},{type:'sealed',productId:'me03-display'},{type:'booster',setId:'me04'}]}
          var v4MarketAssetResults=function(){return[]};
          function v05OfflineManifest(){return['base-resource']}
          var v08HourInfo=function(){},v08DailyEvent=function(){},v08SwitchMode=function(){};
          vm.runInThisContext(fs.readFileSync('cardsim-v03/app/src/main/assets/v108fix.js','utf8'));
          const me25=SETS['me02.5'];if(!me25.products.find(p=>p.id==='me02.5-booster').shopHidden)throw new Error('ME2.5 loose booster still sold directly');
          const bundle=me25.products.find(p=>p.id==='me02.5-lot6');if(bundle.mode!=='sealed'||bundle.opens!==6)throw new Error('ME2.5 bundle not sealed x6');
          const fake=me25.products.find(p=>p.id==='me02.5-display');if(!fake.shopHidden||!fake.marketHidden)throw new Error('ME2.5 fake display not retired');
          const binder=SETS.me04.products.find(p=>p.mode==='binderUnlock');if(!binder.v108OfficialBinder||!String(binder.image).includes('ultrapro.com'))throw new Error('ME04 binder placeholder not replaced');
          const pack=openingPackImage('me04');if(!pack.includes('chaos-ascendant-booster-a-l-unite'))throw new Error('ME04 opening still reuses bad shop art');
          const market=v08MarketAssets('');if(market.some(a=>a.productId==='me02.5-display'))throw new Error('retired display leaked into marketplace');
          const legacyAlias=v4MarketAssetResults('');if(legacyAlias.some(a=>a.productId==='me02.5-display'))throw new Error('retired display leaked through legacy marketplace alias');
          const offline=v05OfflineManifest('me04');if(!offline.includes(pack))throw new Error('opening pack art missing from offline manifest');
          const info=v08HourInfo(Date.UTC(2026,7,21,12));if(!['me02.5','me03','me04','me05'].includes(info.setId))throw new Error('legacy set leaked into normal retail');
          let archives=0;for(let day=0;day<80;day++){state.eventCatalog={};const e=v08DailyEvent(day*V08_DAY+1);if(e?.v108Archive){archives++;if(e.setId!=='old')throw new Error('archive event did not select archive')}}
          if(!archives||archives>=40)throw new Error('archive cadence is not exceptional');
          console.log('V1.0.8 products/retail/archive/offline smoke OK',archives);
          NODE
          python - <<'PY'
          from pathlib import Path
          q=Path('cardsim-v03/app/src/main/assets/v105packpatch.js').read_text(encoding='utf-8')
          assert "uniquePicks(commons,4)" in q and "uniquePicks(uncommons,3)" in q
          assert "Reverse 1" in q and "Reverse 2" in q and "Rare Holo" in q and "out.push(energyCard(setId))" in q
          print('Modern booster 10 cards + Energy structure present')
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; test -x "$S"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$S" --licenses >/dev/null || true
            "$S" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
          cache-cleanup: on-success

      - name: Clean release build without Gradle cache
        working-directory: cardsim-v03
        run: |
          rm -rf app/build .gradle
          gradle clean :app:assembleRelease --no-daemon --no-build-cache --rerun-tasks

      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK=cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk; test -f "$APK"
          for f in v106fix.js v106productart.js v106memory.js v107fix.js v108boot.js v108fix.js v105_catalog_embed.js; do unzip -l "$APK" | grep -q "assets/$f"; done
          unzip -p "$APK" assets/v108fix.js | grep -q "V108_VERSION='1.0.8'"
          unzip -p "$APK" assets/v108fix.js | grep -q 'V108_OPENING_PACK_ART'
          unzip -p "$APK" assets/index.html | grep -q 'v108boot.js'
          SIZE=$(unzip -p "$APK" assets/v105_catalog_embed.js | wc -c); test "$SIZE" -gt 1000000

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          path: ${{ runner.temp }}/signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32137945543

      - name: Sign and verify
        shell: bash
        run: |
          set -euo pipefail
          SP="$(sed -n 's/^Store password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"; KP="$(sed -n 's/^Key password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          OUT="$RUNNER_TEMP/VOX_CardSim_v1.0.8.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/signing/vox-cardsim-release.jks" --ks-key-alias vox-cardsim --ks-pass "pass:$SP" --key-pass "pass:$KP" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT" cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v1.0.8-retail-archives-modefix
          path: ${{ runner.temp }}/VOX_CardSim_v1.0.8.apk
          if-no-files-found: error
