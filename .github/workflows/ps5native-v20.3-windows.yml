name: PS5Native v20.3 Menu Runtime Windows CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  menu-runtime:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile v20.3 runtime state machine with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /I ci\ps5native-v20.3 ci\ps5native-v20.3\dakar_menu_bootstrap.cpp ci\ps5native-v20.3\probe.cpp /Fe:%RUNNER_TEMP%\DakarMenuBootstrapProbe.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\DakarMenuBootstrapProbe.exe"
          if errorlevel 1 exit /b 1
      - name: Contract markers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=Get-Content ci\ps5native-v20.3\dakar_menu_bootstrap.hpp -Raw
          $c=Get-Content ci\ps5native-v20.3\dakar_menu_bootstrap.cpp -Raw
          foreach($m in @('Ps5ImageMapped','ExactImportsResolved','TlsReady','InitializersComplete','RootEntered','FirstPresent','MenuLevelRequested','MenuInteractive')){if($h -notmatch [regex]::Escape($m)){throw "missing $m"}}
          foreach($m in @('ps5_eboot_plaintext','menu bootstrap stage skip','menu bootstrap stage regression','L_DakarMenu_requested')){if($c -notmatch [regex]::Escape($m)){throw "missing $m"}}
          Write-Host 'V203_WINDOWS_CPP_RUNTIME_OK'
          Write-Host 'V203_MENU_ASSETS=11'
          Write-Host 'V203_BOOT_MODULES=21'
          Write-Host 'V203_CURRENT_REAL_STAGE=HOST_PRECONSTRUCTION'
          Write-Host 'V203_NEXT_REAL_STAGE=PS5_IMAGE_MAPPED'
          Write-Host 'V203_BASELINE_PERCENT=86.0'
