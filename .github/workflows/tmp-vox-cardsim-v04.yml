name: VOX CardSim V0.4 Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web assets
        run: |
          node --check cardsim-v03/app/src/main/assets/v03a.js
          node --check cardsim-v03/app/src/main/assets/v03b.js
          node --check cardsim-v03/app/src/main/assets/v04pre.js
          node --check cardsim-v03/app/src/main/assets/v03c.js
          node --check cardsim-v03/app/src/main/assets/v04market1.js
          node --check cardsim-v03/app/src/main/assets/v04market2.js
          node --check cardsim-v03/app/src/main/assets/v04market3.js
          grep -q 'v04.css' cardsim-v03/app/src/main/assets/index.html
          grep -q 'v04market3.js' cardsim-v03/app/src/main/assets/index.html
          grep -q 'versionCode = 4' cardsim-v03/app/build.gradle.kts
          grep -q 'voxCardSimV04' cardsim-v03/app/src/main/assets/v04pre.js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: cardsim-v03
        run: gradle :app:assembleRelease --no-daemon

      - name: Create permanent CardSim signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vox-cardsim-release.jks" \
            -storepass 'VOXCardSim-2026-PrivatePrototype' \
            -keypass 'VOXCardSim-2026-PrivatePrototype' \
            -alias vox-cardsim \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=VOX Card Sim, OU=Private Prototype, O=VOX, C=FR'
          printf '%s\n' \
            'Alias: vox-cardsim' \
            'Store password: VOXCardSim-2026-PrivatePrototype' \
            'Key password: VOXCardSim-2026-PrivatePrototype' \
            'Baseline: v0.4.0' > "$RUNNER_TEMP/signing-info.txt"

      - name: Sign APK with permanent key
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/vox-cardsim-release.jks" \
            --ks-key-alias vox-cardsim \
            --ks-pass pass:VOXCardSim-2026-PrivatePrototype \
            --key-pass pass:VOXCardSim-2026-PrivatePrototype \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/VOX_CardSim_v0.4.apk" \
            cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/VOX_CardSim_v0.4.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v0.4-APK
          path: ${{ runner.temp }}/VOX_CardSim_v0.4.apk

      - name: Upload permanent signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          retention-days: 90
          path: |
            ${{ runner.temp }}/vox-cardsim-release.jks
            ${{ runner.temp }}/signing-info.txt
