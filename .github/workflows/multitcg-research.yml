name: MultiTCG research

on:
  push:
    branches: ["build/multitcg-cardshop-v0.1"]
  workflow_dispatch:

jobs:
  inspect-epl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Enhanced Prefab Loader
        run: git clone --depth 1 https://gitlab.com/tcg-mods/prefabloader.git /tmp/epl
      - name: Inspect current EPL internals needed by MultiTCG
        run: |
          echo '=== SANITIZER ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/LoadingPipeline/SanitizerService.cs
          echo '=== CARD PROCESSOR ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/LoadingPipeline/Processors/CardExpansionProcessor.cs
          echo '=== ITEM PROCESSOR ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/LoadingPipeline/Processors/ItemProcessor.cs
          echo '=== PROCESSING SERVICE ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/LoadingPipeline/ProcessingService.cs
          echo '=== BUNDLE MANAGER ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/BundleManager.cs
          echo '=== STREAMING SERVICE ==='
          cat /tmp/epl/EnhancedPrefabLoader.Core/Assets/StreamingAssetService.cs
          echo '=== PREPATCH DESCRIPTOR ==='
          cat /tmp/epl/EnhancedPrefabLoader.Prepatch/Models/PrepatchBundleDescriptor.cs
          echo '=== DISCOVERY SERVICE ==='
          f=$(find /tmp/epl -type f -iname '*BundleDiscoveryService*.cs' | head -1); [ -n "$f" ] && cat "$f" || true
