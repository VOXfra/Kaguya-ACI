name: MultiTCG research

on:
  push:
    branches: ["build/multitcg-cardshop-v0.1"]
  workflow_dispatch:

jobs:
  inspect-epl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Enhanced Prefab Loader
        run: git clone --depth 1 https://gitlab.com/tcg-mods/prefabloader.git /tmp/epl
      - name: Inspect remaining EPL internals needed by MultiTCG
        run: |
          echo '=== BUNDLE ASSETS PRELOADER ==='
          find /tmp/epl -type f -name 'BundleAssetsPreloader.cs' -print -exec cat {} \;
          echo '=== LOADING / DISCOVERY FILES ==='
          grep -RIl 'prefabloader\|BundlePath\|Directory.GetFiles' /tmp/epl/EnhancedPrefabLoader.Core /tmp/epl/EnhancedPrefabLoader.Prepatch | head -30
          for f in $(grep -RIl '_prefabloader\|Directory.GetFiles' /tmp/epl/EnhancedPrefabLoader.Core /tmp/epl/EnhancedPrefabLoader.Prepatch | head -12); do echo "--- $f"; cat "$f"; done
          echo '=== STREAMING ASSET MODEL ==='
          f=$(grep -RIl 'class StreamingAsset' /tmp/epl/EnhancedPrefabLoader.API /tmp/epl/EnhancedPrefabLoader.Core | head -1); [ -n "$f" ] && cat "$f" || true
          echo '=== SANITIZE EXTENSION ==='
          f=$(grep -RIl 'string Sanitize' /tmp/epl/EnhancedPrefabLoader.Shared | head -1); [ -n "$f" ] && cat "$f" || true
