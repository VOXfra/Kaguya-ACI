name: MultiTCG research

on:
  push:
    branches: ["build/multitcg-cardshop-v0.1"]
  workflow_dispatch:

jobs:
  inspect-epl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Enhanced Prefab Loader
        run: git clone --depth 1 https://gitlab.com/tcg-mods/prefabloader.git /tmp/epl
      - name: Inspect EPL startup order and load entry points
        run: |
          echo '=== CORE PLUGIN ==='
          find /tmp/epl/EnhancedPrefabLoader.Core -maxdepth 2 -type f -name 'Plugin.cs' -print -exec cat {} \;
          echo '=== LOAD BUNDLES CALL SITES ==='
          grep -RIn 'LoadBundlesAsync\|FireOnBundleLoadingComplete\|StartCleanupCoroutine' /tmp/epl/EnhancedPrefabLoader.Core | head -120
          echo '=== PLUGIN IDS ==='
          grep -RIn 'BepInPlugin\|PluginGuid\|GUID' /tmp/epl/EnhancedPrefabLoader.Core /tmp/epl/EnhancedPrefabLoader.API | head -80
          echo '=== FILE HELPER ==='
          f=$(find /tmp/epl -type f -name 'FileHelper.cs' | head -1); [ -n "$f" ] && cat "$f" || true
