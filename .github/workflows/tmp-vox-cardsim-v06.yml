name: VOX CardSim V0.6 Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web assets
        run: |
          node --check cardsim-v03/app/src/main/assets/v03a.js
          node --check cardsim-v03/app/src/main/assets/v03b.js
          node --check cardsim-v03/app/src/main/assets/v04pre.js
          node --check cardsim-v03/app/src/main/assets/v05pre.js
          node --check cardsim-v03/app/src/main/assets/v06pre.js
          node --check cardsim-v03/app/src/main/assets/v03c.js
          node --check cardsim-v03/app/src/main/assets/v04market1.js
          node --check cardsim-v03/app/src/main/assets/v04market2.js
          node --check cardsim-v03/app/src/main/assets/v04market3.js
          node --check cardsim-v03/app/src/main/assets/v05features.js
          node --check cardsim-v03/app/src/main/assets/v05fix.js
          node --check cardsim-v03/app/src/main/assets/v06features.js
          node --check cardsim-v03/app/src/main/assets/v06fix.js
          grep -q 'v06.css' cardsim-v03/app/src/main/assets/index.html
          grep -q 'v06features.js' cardsim-v03/app/src/main/assets/index.html
          grep -q 'versionCode = 6' cardsim-v03/app/build.gradle.kts
          grep -q "SETS\['s6a'\]" cardsim-v03/app/src/main/assets/v06pre.js
          grep -q 'POST_NOTIFICATIONS' cardsim-v03/app/src/main/AndroidManifest.xml
          grep -q 'notifySale' cardsim-v03/app/src/main/java/com/vox/cardsim/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: cardsim-v03
        run: gradle :app:assembleRelease --no-daemon

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: VOX-CardSim-signing-key-v04-baseline
          path: ${{ runner.temp }}/signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32137945543

      - name: Sign APK with permanent key
        shell: bash
        run: |
          STOREPASS="$(sed -n 's/^Store password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          KEYPASS="$(sed -n 's/^Key password: //p' "$RUNNER_TEMP/signing/signing-info.txt")"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/vox-cardsim-release.jks" \
            --ks-key-alias vox-cardsim \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/VOX_CardSim_v0.6.apk" \
            cardsim-v03/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/VOX_CardSim_v0.6.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-CardSim-v0.6-APK
          path: ${{ runner.temp }}/VOX_CardSim_v0.6.apk
