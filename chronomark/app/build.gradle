plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.vox.chronomarkplus'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.vox.chronomarkplus'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
